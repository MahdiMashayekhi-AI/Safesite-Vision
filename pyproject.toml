[project]
name = "safesite"
version = "0.1.0"
description = "Real-time PPE and safety compliance detection with YOLO, ByteTrack and a rule-based compliance engine."
readme = "README.md"
authors = [
    { name = "Mahdi Mashayekhi", email = "108976550+MahdiMashayekhi-AI@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = [
    "computer-vision",
    "object-detection",
    "ppe",
    "safety-compliance",
    "tracking",
    "ultralytics",
    "yolo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "ultralytics>=8.3",
]

[project.urls]
Homepage = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision"
Repository = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision"
Issues = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision/issues"
Changelog = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision/releases"

[project.scripts]
safesite = "safesite.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
app = [
    "fastapi>=0.115",
    "streamlit>=1.38",
    "uvicorn[standard]>=0.30",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Linting and formatting (ruff)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app", "scripts"]
exclude = [".venv", "build", "dist", "runs", "data", "models", "notebooks"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "N",  # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["safesite"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"] # allow bare `assert` in tests
"scripts/*" = ["E402"] # scripts configure the environment before importing

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Static typing (mypy)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["safesite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]

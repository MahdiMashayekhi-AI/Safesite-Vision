[project]
name = "safesite"
version = "0.1.0"
description = "Real-time PPE and safety compliance detection with YOLO, ByteTrack and a rule-based compliance engine."
readme = "README.md"
authors = [
    { name = "Mahdi Mashayekhi", email = "108976550+MahdiMashayekhi-AI@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = [
    "computer-vision",
    "object-detection",
    "ppe",
    "safety-compliance",
    "tracking",
    "ultralytics",
    "yolo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "ultralytics>=8.3",
]

[project.urls]
Homepage = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision"
Repository = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision"
Issues = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision/issues"
Changelog = "https://github.com/MahdiMashayekhi-AI/Safesite-Vision/releases"

[project.scripts]
safesite = "safesite.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
app = [
    "fastapi>=0.115",
    "streamlit>=1.38",
    "uvicorn[standard]>=0.30",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# Pre-commit hooks for SafeSite Vision.
#
# One-time setup per clone:
#   uv run pre-commit install --install-hooks     # installs pre-commit + commit-msg
#
# Run against every file:
#   uv run pre-commit run --all-files
#
# Keep `ruff-pre-commit` in sync with the `ruff` version in the `dev` group.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  # Linting and formatting ---------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # Generic hygiene ----------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # 500 KB ceiling: model weights, datasets and the lockfile are the usual
        # offenders. uv.lock is machine-generated and legitimately large.
        args: [--maxkb=500]
        exclude: ^uv\.lock$

  # Commit message format ----------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commit message
        stages: [commit-msg]
        args: [--strict]
